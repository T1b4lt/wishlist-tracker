server {
    listen 7755;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Serve frontend static files (SPA fallback to index.html)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite emits content-hashed files, so they can be cached aggressively
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Proxy API requests to FastAPI backend (the /api prefix is stripped)
    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # AI extraction launches a browser and calls the LLM, which can take
        # longer than Nginx's default 60s timeout.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
