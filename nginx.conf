server {
    listen 7755;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Serve frontend static files (SPA fallback to index.html)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite emits content-hashed files, so they can be cached aggressively
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Proxy API requests to FastAPI backend (the /api prefix is stripped)
    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # FastAPI redirects paths missing the trailing slash to an absolute
        # URL without the /api prefix (and without the public port); rewrite
        # it into a relative path that goes back through this proxy.
        # absolute_redirect off keeps it relative, so the port stays correct
        # when the container port is published under a different number.
        proxy_redirect ~^https?://[^/]+/(.*)$ /api/$1;
        absolute_redirect off;

        # AI extraction launches a browser and calls the LLM, which can take
        # longer than Nginx's default 60s timeout.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
