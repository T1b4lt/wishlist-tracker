[project]
name = "wishlist-tracker-backend"
version = "0.1.0"
description = "Wishlist tracker backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "python-dotenv>=1.2.3",
    "python-telegram-bot>=22.8",
    "sqlmodel>=0.0.47",
    "stagehand>=4.1.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "ruff==0.16.8",
]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src"]

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: isort, UP: pyupgrade, B: bugbear
select = ["E", "W", "F", "I", "UP", "B"]
# Line length is enforced by the formatter; long strings/comments are allowed.
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
