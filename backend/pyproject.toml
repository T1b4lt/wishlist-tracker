[project]
name = "wishlist-tracker-backend"
version = "0.1.0"
description = "Wishlist tracker backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "python-dotenv>=1.2.3",
    "python-telegram-bot>=22.8",
    "sqlmodel>=0.0.47",
    "stagehand>=4.1.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff==0.16.8",
]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src"]

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: isort, UP: pyupgrade, B: bugbear
select = ["E", "W", "F", "I", "UP", "B"]
# Line length is enforced by the formatter; long strings/comments are allowed.
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    # Upstream Starlette nudges toward the (optional, unrelated) httpx2
    # package; irrelevant to what these tests exercise.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:UserWarning",
]
