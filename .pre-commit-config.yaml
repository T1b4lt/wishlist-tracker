# Git hooks managed with pre-commit (https://pre-commit.com).
# Setup: see "Git Hooks" in the root README.
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]

repos:
  # ---------------------------------------------------------------------------
  # Generic file hygiene
  # ---------------------------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-json
      - id: check-yaml
      - id: check-toml
      - id: detect-private-key

  # ---------------------------------------------------------------------------
  # Secret scanning
  # ---------------------------------------------------------------------------
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  # ---------------------------------------------------------------------------
  # Backend (Python)
  # ---------------------------------------------------------------------------
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff-check
        args: [--fix, --config=backend/pyproject.toml]
        files: ^backend/
      - id: ruff-format
        args: [--config=backend/pyproject.toml]
        files: ^backend/

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.18
    hooks:
      - id: uv-lock
        args: [--project=backend]
        files: ^backend/(pyproject\.toml|uv\.lock)$

  # ---------------------------------------------------------------------------
  # Frontend (JavaScript / React)
  # Uses the tools installed in frontend/node_modules (run `npm install` first)
  # so versions and plugins match the frontend project configuration.
  # ---------------------------------------------------------------------------
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: bash -c 'cd frontend && ./node_modules/.bin/prettier --write --ignore-unknown --log-level=warn "${@#frontend/}"' --
        language: system
        types: [text]
        files: ^frontend/
        exclude: ^frontend/package-lock\.json$
      - id: eslint
        name: eslint
        entry: bash -c 'cd frontend && ./node_modules/.bin/eslint --fix --max-warnings=0 "${@#frontend/}"' --
        language: system
        types_or: [javascript, jsx]
        files: ^frontend/

  # ---------------------------------------------------------------------------
  # Commit message (Conventional Commits)
  # ---------------------------------------------------------------------------
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
